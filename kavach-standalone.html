<style>
/* Kavach design system — warm, calm, protective. Aubergine + marigold + coral on warm paper. */
:root{
  --bg:#FBF5EE; --bg2:#F4EAE0; --ink:#2A1235; --ink2:#4B3555; --muted:#7A6A82;
  --card:#FFFFFF; --line:#EADCCF;
  --brand:#8E2A5B; --brand-d:#6E1D45; --coral:#E4572E; --gold:#F2A33A;
  --safe:#1F7A6D; --safe-bg:#E3F3EF; --danger:#C5283D; --danger-bg:#FCE8EA; --warn:#9A5B00; --warn-bg:#FFF2DB; --info-bg:#EFE6F5;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(42,18,53,.06),0 10px 28px rgba(42,18,53,.07);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:268px 1fr;min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,3.4vw,2.7rem)} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0 0 .8em} a{color:var(--brand)} svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:#fff;padding:8px 12px;z-index:99}
.hidden{display:none!important}

/* sidebar */
.side{position:sticky;top:0;height:100vh;background:var(--ink);color:#F5E9F7;padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px}
.brand img{width:42px;height:42px}
.brand b{font:700 1.5rem var(--serif);letter-spacing:.01em;display:block;line-height:1}
.brand small{display:block;color:#CDB5D6;font-size:.72rem;margin-top:4px;line-height:1.25}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#E9D8EE;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:linear-gradient(135deg,var(--coral),var(--brand));color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nav a.sos{color:#FFB4A2}.nav a.sos.on{color:#fff}
.side-foot{margin-top:auto;display:grid;gap:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:#E9D8EE;padding:6px;border-radius:8px;font-weight:600}
.seg button.on{background:#fff;color:var(--ink)}
.side-btn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:0;color:#E9D8EE;padding:10px 12px;border-radius:10px;text-align:left}
.side-btn:hover{background:rgba(255,255,255,.15)}
.disguise .brand b{font-family:var(--sans)}

/* main */
main{padding:34px 44px 90px;min-width:0;outline:0}
.page{max-width:1080px;margin:0 auto;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:26px}
.eyebrow{font:700 .74rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
.lead{font-size:1.1rem;color:var(--ink2);max-width:62ch}
.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;word-break:break-all}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:start}
.stack>*+*{margin-top:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card.tint{background:linear-gradient(180deg,#FFF7EC,#FFF)}
.card.danger{background:var(--danger-bg);border-color:#F3C3C9}
.card.safe{background:var(--safe-bg);border-color:#BFE3DB}
.card.warn{background:var(--warn-bg);border-color:#F2DAA8}
.card.dark{background:var(--ink);color:#F5E9F7;border-color:transparent}
.card.dark .muted{color:#CDB5D6}
.card-title{display:flex;align-items:center;gap:10px;font:700 1.08rem var(--serif);margin-bottom:12px}
.card-title .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--info-bg);color:var(--brand)}
.card-title .ic.coral{background:#FFE5DB;color:var(--coral)}.card-title .ic.safe{background:var(--safe-bg);color:var(--safe)}.card-title .ic.gold{background:var(--warn-bg);color:var(--warn)}
a.card.link{text-decoration:none;color:inherit;display:block;transition:transform .15s,box-shadow .15s}
a.card.link:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(42,18,53,.06),0 16px 36px rgba(42,18,53,.12)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:11px 18px;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(42,18,53,.12)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border-color:transparent}
.btn.coral{background:linear-gradient(135deg,var(--coral),#C93E1C);color:#fff;border-color:transparent}
.btn.safe{background:var(--safe);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 13px;font-size:.88rem}.btn.lg{padding:15px 26px;font-size:1.05rem}.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-weight:700;font-size:.9rem;color:var(--ink2)}
input[type=text],input[type=password],input[type=tel],input[type=datetime-local],select,textarea{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink)}
textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(142,42,91,.12)}
.hint{font-size:.83rem;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--brand);width:18px;height:18px}
.chk:has(input:checked){border-color:var(--safe);background:var(--safe-bg)}
.chk.done span{text-decoration:line-through;color:var(--muted)}

/* chips, badges, progress */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--info-bg);color:var(--brand)}
.chip.safe{background:var(--safe-bg);color:var(--safe)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.danger{background:var(--danger-bg);color:var(--danger)}.chip.gray{background:#EFE9E3;color:var(--ink2)}
.progress{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--brand));border-radius:inherit}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font:700 2rem var(--serif);line-height:1}.stat span{color:var(--muted);font-size:.85rem}
.ring{position:relative;width:104px;height:104px;flex:none}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 1.4rem var(--serif)}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:999px;margin-bottom:20px;overflow:auto;width:fit-content;max-width:100%}
.tab{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tab.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(42,18,53,.1)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;background:linear-gradient(135deg,#2A1235,#5A1F4B 60%,#8E2A5B);color:#fff;border-radius:28px;padding:40px 44px;overflow:hidden;position:relative;margin-bottom:24px}
.hero h1{color:#fff;font-size:clamp(2rem,4vw,3.1rem)}
.hero p{color:#EBD9EF;font-size:1.08rem;max-width:48ch}
.hero .tag{font:600 1.05rem var(--serif);font-style:italic;color:#FFD08A;margin-bottom:18px}
.hero img{width:100%;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.28))}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.quick .card{padding:18px}.quick h3{margin:10px 0 4px}.quick p{margin:0;color:var(--muted);font-size:.9rem}
.qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.qi.a{background:#FFE5DB;color:var(--coral)}.qi.b{background:var(--info-bg);color:var(--brand)}.qi.c{background:var(--safe-bg);color:var(--safe)}.qi.d{background:var(--warn-bg);color:var(--warn)}

/* steps / timeline */
.steps{counter-reset:s;display:grid;gap:12px}
.step{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff}
.step::before{counter-increment:s;content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.step h3{margin:0 0 2px;font-family:var(--sans);font-size:1rem}.step p{margin:0;color:var(--muted);font-size:.92rem}
.tl{position:relative;padding-left:26px;display:grid;gap:14px}.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>.node{position:relative}.tl>.node::before{content:"";position:absolute;left:-24px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--bg)}
.pipe{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.pipe .p{padding:7px 12px;border-radius:999px;background:var(--bg2);font-weight:700;font-size:.83rem}.pipe .p.on{background:var(--ink);color:#fff}.pipe .ar{color:var(--muted)}

/* dropzone, fingerprints */
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed #D7BFCB;border-radius:var(--r);padding:30px 18px;background:#FFFAF4;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);background:#FFF1F5}
.drop svg.i{width:30px;height:30px;color:var(--brand)}
.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:var(--bg2);display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:112px;flex:none}.bits i{aspect-ratio:1;border-radius:2px;background:#EADCCF}.bits i.on{background:var(--brand)}
.verdict{padding:16px 18px;border-radius:var(--r-sm);font-weight:700;display:flex;gap:12px;align-items:center}
.verdict.block{background:var(--danger-bg);color:var(--danger)}.verdict.review{background:var(--warn-bg);color:var(--warn)}.verdict.allow{background:var(--safe-bg);color:var(--safe)}
.mock{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.mock-top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#3C6EE0,#7A4BD8);color:#fff;font-weight:700}
.mock-body{padding:16px;display:grid;gap:12px}
.variant{border:1.5px solid var(--line);border-radius:12px;padding:6px;background:#fff;text-align:center;font-size:.76rem;font-weight:700}
.variant canvas,.variant img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;margin-bottom:5px}
.variant:hover{border-color:var(--brand)}

/* table-ish */
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.92rem}.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;word-break:break-word}
.entry{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:16px}
.code{background:#1D0F26;color:#F2E3F6;border-radius:12px;padding:14px;overflow:auto;font:.8rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.letter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;font:.95rem/1.7 Georgia,serif;white-space:pre-wrap;max-height:520px;overflow:auto}
mark{background:#FFE29A;border-radius:4px;padding:0 3px}

/* helplines */
.hl{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff}
.hl>div>b{font:700 1.5rem var(--serif);display:block;line-height:1.1}.hl span{font-size:.85rem;color:var(--muted);display:block;margin-top:2px}.hl span b{font:700 .9rem var(--sans);color:var(--ink);display:inline}.hl.red{border-color:#F3C3C9;background:var(--danger-bg)}

/* chat */
.chat{display:flex;flex-direction:column;height:min(640px,76vh)}
.chat-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.chat-head img{width:46px;height:46px;border-radius:50%}
.chat-log{flex:1;overflow:auto;padding:16px 4px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;animation:rise .25s ease both}
.msg.bot{background:#F6EEF8;border-bottom-left-radius:6px;align-self:flex-start}.msg.user{background:var(--ink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.quick-r{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}.quick-r button{border:1.5px solid var(--brand);color:var(--brand);background:#fff;padding:7px 14px;border-radius:999px;font-weight:700;font-size:.9rem}.quick-r button:hover{background:var(--brand);color:#fff}
.typing{display:flex;gap:4px;padding:14px 16px;background:#F6EEF8;border-radius:18px;align-self:flex-start}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-in{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}.chat-in input{flex:1}
.crisis-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--danger-bg);border:1px solid #F3C3C9;color:var(--danger);padding:10px 14px;border-radius:var(--r-sm);font-weight:700;margin-bottom:16px}
.breath{display:grid;place-items:center;padding:20px}.breath .orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD9C2,var(--coral) 70%);display:grid;place-items:center;color:#fff;font-weight:700;transition:transform 4s ease-in-out;box-shadow:0 0 0 14px rgba(228,87,46,.12)}
.breath .orb.in{transform:scale(1.35)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(42,18,53,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:60}
.dialog{background:#fff;border-radius:22px;padding:26px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.esc{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#2A1235,#5A1F4B);color:#fff;overflow:auto;padding:28px}
.esc-in{max-width:760px;margin:0 auto;display:grid;gap:16px}
.esc h1{color:#fff}.esc .card{color:var(--ink)}
.big-count{font:700 4rem var(--serif);line-height:1;color:#FFD08A}
.log{display:grid;gap:6px;font-size:.88rem}.log div{padding:8px 12px;border-radius:10px;background:var(--bg2)}.log div.ok{background:var(--safe-bg)}.log div.sim{background:var(--warn-bg)}
.simbanner{background:var(--warn-bg);border:2px dashed var(--gold);color:var(--warn);padding:10px 14px;border-radius:12px;font-weight:700}
.toasts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:99;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:rise .25s both}.toast.out{opacity:0;transition:.4s}.toast.warn{background:var(--danger)}
.qexit{position:fixed;top:14px;right:14px;z-index:70;display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:700;color:var(--ink2);box-shadow:var(--sh)}
.qexit:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

/* lock/onboarding */
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;overflow:auto}
.gate-art{background:linear-gradient(150deg,#2A1235,#8E2A5B);display:grid;place-items:center;padding:36px;color:#fff;text-align:center}
.gate-art img{max-width:480px;width:100%}.gate-art .tag{font:italic 600 1.3rem var(--serif);color:#FFD08A;margin-top:14px}
.gate-form{display:grid;align-content:center;padding:44px;max-width:560px;margin:0 auto;width:100%}
.promise{display:grid;gap:8px;margin:16px 0;padding:0;list-style:none}.promise li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}.promise svg{color:var(--safe);margin-top:2px}

/* tabbar */
.tabbar{display:none}
@media(max-width:900px){
  body{grid-template-columns:1fr}.side{display:none}
  main{padding:20px 16px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}

/* Tiny hash router. Views register themselves; app.js decides when to render. */
const Router = {
  routes: {},
  current: 'home',
  onChange: null,
  register(name, fn) { this.routes[name] = fn; },
  go(name) { location.hash = '#/' + name; },
  busy: false,
  again: false,
  /* Renders are serialised: if a navigation happens mid-render, the latest route is rendered once
     the current one finishes, so two async views can never overwrite each other. */
  async render() {
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      do {
        this.again = false;
        const name = (location.hash.replace(/^#\//, '') || 'home').split('?')[0];
        const fn = this.routes[name] || this.routes.home;
        this.current = this.routes[name] ? name : 'home';
        const root = $('#view');
        if (!root || !fn) break;
        root.innerHTML = '';
        window.scrollTo(0, 0);
        try { await fn(root); }
        catch (e) { console.error(e); root.innerHTML = `<div class="page"><div class="card danger"><b>Something went wrong showing this page.</b><p class="small">${esc(e.message)}</p></div></div>`; }
        if (this.onChange) this.onChange(this.current);
      } while (this.again);
    } finally { this.busy = false; }
  },
};
window.addEventListener('hashchange', () => Router.render());

<script>
'use strict';
/*
 * Store — everything a woman saves in Kavach lives ONLY in this browser's IndexedDB,
 * encrypted with AES-256-GCM.
 *   • "pass" mode  : key derived from her passphrase (PBKDF2-SHA256, 250k iterations). We cannot recover it.
 *   • "device" mode: random key stored beside the data (protects against casual snooping only; demo convenience).
 * Records are { id, iv, ct }. Nothing is ever sent to a server.
 */
const Store = (() => {
  let db, key = null, cfg = null;
  const enc = s => new TextEncoder().encode(s);
  const dec = b => new TextDecoder().decode(b);

  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('kavach', 1);
    r.onupgradeneeded = () => { ['evidence', 'blobs', 'shield', 'cases', 'kv', 'meta'].forEach(n => r.result.createObjectStore(n, { keyPath: 'id' })); };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const store = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const rawGet = (s, id) => req(store(s).get(id));
  const rawPut = (s, rec) => req(store(s, 'readwrite').put(rec));
  const rawAll = s => req(store(s).getAll());
  const rawDel = (s, id) => req(store(s, 'readwrite').delete(id));

  async function deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey('raw', enc(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function seal(bytes) {
    if (!key) throw new Error('locked');
    const iv = crypto.getRandomValues(new Uint8Array(12));
    return { iv, ct: await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes) };
  }
  const unseal = rec => { if (!key) throw new Error('locked'); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: rec.iv }, key, rec.ct); };

  return {
    async init() {
      await open();
      cfg = await rawGet('meta', 'cfg');
      if (!cfg) return 'new';
      if (cfg.mode === 'device') { key = await crypto.subtle.importKey('jwk', cfg.jwk, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); return 'open'; }
      return 'locked';
    },
    async setupPass(pass) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      key = await deriveKey(pass, salt);
      cfg = { id: 'cfg', mode: 'pass', salt, chk: await seal(enc('kavach-ok')) };
      await rawPut('meta', cfg);
    },
    async setupDevice() {
      const k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
      const jwk = await crypto.subtle.exportKey('jwk', k);
      key = await crypto.subtle.importKey('jwk', jwk, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
      cfg = { id: 'cfg', mode: 'device', jwk };
      await rawPut('meta', cfg);
    },
    async unlock(pass) {
      try {
        const k = await deriveKey(pass, cfg.salt);
        const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: cfg.chk.iv }, k, cfg.chk.ct);
        if (dec(p) !== 'kavach-ok') return false;
        key = k; return true;
      } catch { return false; }
    },
    lock() { key = null; },
    isOpen: () => !!key,
    mode: () => cfg && cfg.mode,

    async put(s, id, obj) { const { iv, ct } = await seal(enc(JSON.stringify(obj))); await rawPut(s, { id, iv, ct }); return obj; },
    async get(s, id, def = null) { const r = await rawGet(s, id); return r ? JSON.parse(dec(await unseal(r))) : def; },
    async all(s) { const out = []; for (const r of await rawAll(s)) out.push(JSON.parse(dec(await unseal(r)))); return out; },
    del: rawDel,
    async putBlob(id, buf) { const { iv, ct } = await seal(buf); await rawPut('blobs', { id, iv, ct }); },
    async getBlob(id) { const r = await rawGet('blobs', id); return r ? unseal(r) : null; },

    async wipe() {
      key = null; cfg = null;
      db.close();

<script>
'use strict';
/*
 * Forensics — honest, explainable, on-device signals. NOT a deepfake detector.
 *  • EXIF reader: finds hidden GPS / device / date data before a photo is shared.
 *  • Error Level Analysis (ELA): shows uneven JPEG compression, one weak hint that a region may have been edited.
 *  • Privacy cleaner: re-encodes a photo, dropping all metadata.
 */
const Forensics = (() => {
  function parseExif(buf) {
    try {
      const v = new DataView(buf);
      if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return { format: 'not-jpeg', found: false };
      let off = 2;
      while (off + 4 < v.byteLength) {
        const marker = v.getUint16(off); off += 2;
        if (marker === 0xFFDA || (marker & 0xFF00) !== 0xFF00) break;
        const len = v.getUint16(off);
        if (marker === 0xFFE1 && v.getUint32(off + 2) === 0x45786966) return readTiff(v, off + 8);
        off += len;
      }
      return { format: 'jpeg', found: false };
    } catch { return { format: 'jpeg', found: false, error: true }; }
  }

  function readTiff(v, t) {
    const le = v.getUint16(t) === 0x4949;
    const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
    const out = { format: 'jpeg', found: true, gps: null };
    const size = e => ({ 2: 1, 3: 2, 4: 4, 5: 8 }[e.type] || 1) * e.count;
    const at = e => size(e) > 4 ? t + u32(e.vo) : e.vo;
    const str = e => { const o = at(e); let s = ''; for (let i = 0; i < e.count - 1; i++) { const c = v.getUint8(o + i); if (!c) break; s += String.fromCharCode(c); } return s.trim(); };
    const rat = o => { const d = u32(o + 4); return d ? u32(o) / d : 0; };
    const entries = ifd => { const n = u16(ifd), a = []; for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (e + 12 > v.byteLength) break; a.push({ tag: u16(e), type: u16(e + 2), count: u32(e + 4), vo: e + 8 }); } return a; };
    let gpsPtr = 0;
    for (const e of entries(t + u32(t + 4))) {
      if (e.tag === 0x010F) out.make = str(e);
      else if (e.tag === 0x0110) out.model = str(e);
      else if (e.tag === 0x0131) out.software = str(e);
      else if (e.tag === 0x0132) out.date = str(e);
      else if (e.tag === 0x8825) gpsPtr = u32(e.vo);
    }
    if (gpsPtr) {
      const g = {};
      for (const e of entries(t + gpsPtr)) {
        const o = at(e);
        if (e.tag === 1) g.latRef = String.fromCharCode(v.getUint8(e.vo));
        else if (e.tag === 3) g.lonRef = String.fromCharCode(v.getUint8(e.vo));
        else if (e.tag === 2) g.lat = rat(o) + rat(o + 8) / 60 + rat(o + 16) / 3600;
        else if (e.tag === 4) g.lon = rat(o) + rat(o + 8) / 60 + rat(o + 16) / 3600;
      }

    }

  }

  /** Error Level Analysis: recompress at 90% and amplify the difference. */
  async function ela(img, quality = 0.9, scale = 18) {
    const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
    const r = Math.min(1, 900 / Math.max(sw, sh));
    const w = Math.max(8, Math.round(sw * r)), h = Math.max(8, Math.round(sh * r));
    const c = canvasEl(w, h), x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, w, h);
    const a = x.getImageData(0, 0, w, h);
    const re = await createImageBitmap(await canvasBlob(c, 'image/jpeg', quality));
    const c2 = canvasEl(w, h), x2 = c2.getContext('2d', { willReadFrequently: true });
    x2.drawImage(re, 0, 0);
    const b = x2.getImageData(0, 0, w, h);

    const out = x.createImageData(w, h), cell = 24, gx = Math.ceil(w / cell), gy = Math.ceil(h / cell);
    const sums = new Float64Array(gx * gy), cnt = new Float64Array(gx * gy);
    for (let i = 0; i < a.data.length; i += 4) {
      const d = (Math.abs(a.data[i] - b.data[i]) + Math.abs(a.data[i + 1] - b.data[i + 1]) + Math.abs(a.data[i + 2] - b.data[i + 2])) / 3;
      const vv = Math.min(255, d * scale);
      out.data[i] = out.data[i + 1] = out.data[i + 2] = vv; out.data[i + 3] = 255;
      const p = i / 4, cx = Math.floor((p % w) / cell), cy = Math.floor(Math.floor(p / w) / cell);
      sums[cy * gx + cx] += d; cnt[cy * gx + cx]++;
    }
    const means = [...sums].map((s, i) => cnt[i] ? s / cnt[i] : 0);
    const mu = means.reduce((p, q) => p + q, 0) / means.length || 0.0001;
    const sd = Math.sqrt(means.reduce((p, q) => p + (q - mu) ** 2, 0) / means.length);
    const cv = sd / (mu || 0.0001);
    const outliers = means.filter(m => m > mu + 2 * sd).length / means.length;
    const level = cv > 1.1 || outliers > 0.06 ? 'high' : cv > 0.65 || outliers > 0.03 ? 'medium' : 'low';
    const res = canvasEl(w, h); res.getContext('2d').putImageData(out, 0, 0);
    return { canvas: res, cv: +cv.toFixed(2), outliers: +(outliers * 100).toFixed(1), level };
  }

  /** Re-encode through a canvas: drops EXIF/GPS/device info entirely. */
  async function clean(img, maxSide = 4096, quality = 0.92) {
    const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
    const r = Math.min(1, maxSide / Math.max(sw, sh));
    const c = canvasEl(Math.round(sw * r), Math.round(sh * r));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return canvasBlob(c, 'image/jpeg', quality);
  }

  return { parseExif, ela, clean };
})();

/*
 * Image Shield — a perceptual-hash (pHash, DCT based) fingerprint computed ON THE DEVICE.
 * Only the 64-bit fingerprint is kept; the photo itself is never stored or uploaded.
 * A platform that holds the fingerprint can block re-uploads, even resized, recompressed,
 * brightened, cropped or mirrored copies. This is the same principle as StopNCII.org (which
 * uses its own hashes and real platform partnerships). Here it is demonstrated end-to-end
 * with a clearly-labelled mock platform.
 */
const Shield = (() => {
  const N = 32, K = 8;
  const COS = Array.from({ length: K }, (_, u) => Float64Array.from({ length: N }, (_, x) => Math.cos((2 * x + 1) * u * Math.PI / (2 * N))));
  const POP = [0, 1, 1, 2, 1, 2, 2, 3, 1, 2, 2, 3, 2, 3, 3, 4];

  function gray(src, mirror) {

    const mid = canvasEl(128, 128), mx = mid.getContext('2d'); mx.imageSmoothingQuality = 'high'; mx.drawImage(src, 0, 0, 128, 128);
    const c = canvasEl(N, N), x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high';
    if (mirror) { x.translate(N, 0); x.scale(-1, 1); }

<script>
'use strict';
/*
 * Evidence Vault — append-only, hash-chained, encrypted.
 * Every entry stores the SHA-256 of each file, a timestamp, and the hash of the previous entry.
 * Editing or removing any past entry breaks every later link, so tampering is detectable.
 * Exports a printable report with a Bharatiya Sakshya Adhiniyam s.63 certificate template.
 */
const Vault = (() => {
  const GENESIS = '0'.repeat(64);

  const canonical = e => JSON.stringify({ v: 1, createdAt: e.createdAt, platform: e.platform, url: e.url, handle: e.handle, desc: e.desc, seen: e.seen, files: e.files.map(f => f.sha256), prevHash: e.prevHash });
  const hashEntry = e => sha256(canonical(e));

  async function list() { return (await Store.all('evidence')).sort((a, b) => a.createdAt.localeCompare(b.createdAt)); }

  async function add({ platform, url, handle, desc, seen, files }) {
    const all = await list();
    const prevHash = all.length ? all[all.length - 1].entryHash : GENESIS;
    const fmeta = [];
    for (const f of files) {
      const buf = await f.arrayBuffer(), blobId = uid();
      await Store.putBlob(blobId, buf);
      fmeta.push({ name: f.name, type: f.type || 'application/octet-stream', size: f.size, sha256: await sha256(buf), blobId });
    }
    const e = { id: uid(), createdAt: new Date().toISOString(), platform, url, handle: (handle || '').trim(), desc, seen: seen || '', files: fmeta, prevHash };
    e.entryHash = await hashEntry(e);
    await Store.put('evidence', e.id, e);
    return e;
  }

  async function verify(entries) {
    let prev = GENESIS;
    for (let i = 0; i < entries.length; i++) {
      const e = entries[i];
      if (e.prevHash !== prev || (await hashEntry(e)) !== e.entryHash) return { ok: false, brokenAt: i };
      prev = e.entryHash;
    }
    return { ok: true, head: prev, count: entries.length };
  }

  const normHandle = h => (h || '').toLowerCase().replace(/^@/, '').trim();
  function linked(entries) {
    const g = {};
    entries.forEach(e => { const k = normHandle(e.handle); if (k) (g[k] = g[k] || []).push(e); });
    return Object.entries(g).filter(([, v]) => v.length > 1).map(([handle, items]) => ({ handle, items }));
  }

  async function reportHtml(entries, who = {}) {
    const v = await verify(entries);
    const rows = [];
    for (const [i, e] of entries.entries()) {
      let imgs = '';
      for (const f of e.files) if (/^image\//.test(f.type)) {
        const buf = await Store.getBlob(f.blobId);
        if (buf) imgs += `<img src="${await blobToDataURL(new Blob([buf], { type: f.type }))}" alt="">`;
      }
      rows.push(`<section class="e"><h3>Exhibit ${i + 1}: ${esc(e.platform)}${e.handle ? ' · ' + esc(e.handle) : ''}</h3>
        <table><tr><th>Recorded in vault (UTC)</th><td>${esc(e.createdAt)}</td></tr>
        ${e.seen ? `<tr><th>Content seen / received at</th><td>${esc(e.seen)}</td></tr>` : ''}
        <tr><th>URL / location</th><td>${esc(e.url || '—')}</td></tr><tr><th>Description</th><td>${esc(e.desc)}</td></tr>
        <tr><th>Previous entry hash</th><td class="m">${e.prevHash}</td></tr><tr><th>Entry hash (SHA-256)</th><td class="m">${e.entryHash}</td></tr>
        ${e.files.map(f => `<tr><th>File</th><td>${esc(f.name)} (${f.size} bytes)<br><span class="m">SHA-256: ${f.sha256}</span></td></tr>`).join('')}</table>
        <div class="imgs">${imgs}</div></section>`);
    }
    const hashes = entries.flatMap(e => e.files.map(f => `${f.name}: ${f.sha256}`)).join('\n');
    return `<!doctype html><html><head><meta charset="utf-8"><title>Kavach Evidence Report</title><style>
      body{font:14px/1.55 Georgia,serif;color:#1b1220;max-width:820px;margin:28px auto;padding:0 20px}h1{font-size:26px;margin:0}h2{border-bottom:2px solid #8E2A5B;padding-bottom:4px;margin-top:34px}
      .bar{background:#2A1235;color:#fff;padding:14px 18px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
      table{width:100%;border-collapse:collapse;margin:8px 0}th,td{border:1px solid #d9cfd9;padding:6px 9px;text-align:left;vertical-align:top}th{width:200px;background:#faf3f6;font-family:sans-serif;font-size:12px}
      .m{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all}.e{page-break-inside:avoid;margin-bottom:22px}.imgs img{max-width:48%;margin:4px;border:1px solid #ddd}
      .ok{background:#e3f3ef;border:1px solid #1F7A6D;padding:10px 14px;border-radius:8px}.bad{background:#fce8ea;border:1px solid #C5283D;padding:10px 14px;border-radius:8px}
      pre{white-space:pre-wrap;background:#faf3f6;padding:12px;border-radius:8px}button{padding:9px 16px;border-radius:99px;border:0;background:#E4572E;color:#fff;font-weight:700;cursor:pointer}@media print{.noprint{display:none}}</style></head><body>
      <div class="bar"><div><h1 style="color:#fff">Digital Evidence Report</h1><small>Generated by Kavach · ${new Date().toISOString()}</small></div><button class="noprint" onclick="print()">Print / Save as PDF</button></div>
      <p><b>Prepared for:</b> ${esc(who.name || 'Complainant (name withheld)')} &nbsp; <b>Exhibits:</b> ${entries.length}</p>
      <div class="${v.ok ? 'ok' : 'bad'}"><b>Integrity check:</b> ${v.ok ? `all ${v.count} entries form an unbroken SHA-256 hash chain. Chain head: <span class="m">${v.head}</span>` : `chain BROKEN at exhibit ${v.brokenAt + 1}. Records may have been altered.`}</div>
      <h2>Exhibits</h2>${rows.join('') || '<p>No entries.</p>'}
      <h2>Annexure A: How to verify this report</h2>
      <p>1. For each file, compute its SHA-256 (<code>sha256sum file</code> on Linux/macOS, <code>certutil -hashfile file SHA256</code> on Windows) and compare it with the value above. 2. Each exhibit's “entry hash” is the SHA-256 of its recorded fields plus the previous entry hash; altering any exhibit changes every later hash. 3. The chain head above can be independently timestamped (for example, e-mailed to a third party) to fix the latest state at a point in time.</p>
      <h2>Annexure B: Certificate for electronic records (template)</h2>
      <p><i>Template for a certificate under Section 63(4)(c) of the Bharatiya Sakshya Adhiniyam, 2023 (which replaced Section 65B of the Indian Evidence Act). Have a lawyer review and complete it. It must be signed by the person in charge of the device and, where required, an expert.</i></p>
      <pre>CERTIFICATE
I, ____________________ (name), son/daughter/wife of ____________________, residing at ____________________, do hereby certify:
1. I am the person who owns / is in lawful control of the device(s): ____________________ used to create and store the electronic record(s) described below.
2. The computer/device was operating properly during the relevant period, and the electronic record(s) were produced in the ordinary course of my use of it.
3. The information in the record(s) is a true reproduction of what was received/displayed on ____________________ (platform) on ____________________ (date/time).
4. The record(s) are identified by the following SHA-256 hash values:
${hashes || '(none)'}
Date: ____________  Place: ____________        Signature: ____________________

PART B (EXPERT, if applicable): ____________________</pre>
      <p style="color:#6b5a72;font-size:12px">Kavach is a self-help tool, not a law firm. This report supports a complaint; it does not guarantee admissibility. Original files should be preserved.</p></body></html>`;
  }

  return { list, add, verify, linked, reportHtml, GENESIS };
})();

 *  • Risk is detected ON DEVICE, locally, before anything else happens. Crisis flows never depend on a network call.

 *  • A browser cannot silently send SMS or reach 112. Without a relay (CONFIG.alertEndpoint) this prototype runs in clearly

    /\b(going|planning|about) to (die|kill myself|end (it|my life))\b/i,
    /आत्महत्या|खुदकुशी|मरना चाहती|मर जाना चाहती|जीना नहीं चाहती|जान दे दू/,
    /\b(marna chahti|mar jana chahti|khudkushi|jeena nahi chahti|jaan de dungi|suicide kar)/i,
  ];
  const PLAN = /\b(pills|tablets|overdose|rope|hang(ing)? myself|jump(ing)? (off|from)|bridge|terrace|roof|knife|blade|poison|pesticide|gun|tonight|right now|this (evening|night)|after everyone sleeps|goodbye|note)\b/i;
  const PASSIVE = /\b(disappear|can'?t (go on|do this( any ?more)?|take (it|this)( any ?more)?|cope)|tired of (living|life|everything|fighting)|no way out|nobody would (care|miss)|everyone (would be|is) better (off )?without me|i('m| am) a burden|worthless|hopeless|nothing matters|life is (pointless|meaningless))\b/i;

  function assess(text) {
    const s = String(text || '');
    const high = HIGH.some(r => r.test(s)), plan = PLAN.test(s), passive = PASSIVE.test(s);
    return { level: high && plan ? 3 : high ? 2 : passive ? 1 : 0, high, plan, passive };
  }
  return { assess };
})();

/* ------------------------------------------------------------- companion */
const Companion = (() => {
  const state = { awaiting: null, turn: 0, level: 0, lastSafety: '' };
  const transcript = [];
  const pick = (arr, n) => arr[n % arr.length];
  const Q_SAFE = [{ l: "I'm safe right now", v: '__safe__' }, { l: "I'm not sure I'll stay safe", v: '__unsure__' }, { l: "I'm in danger right now", v: '__danger__' }];

  const imminent = () => { state.awaiting = null; state.level = 3; return { level: 3, act: 'esc', msgs: ["I'm really worried about you, and I want you to be safe right now.", "I'm going to help you reach people immediately. You don't have to do anything except stay here with me."], quick: [] }; };
  const safetyCheck = () => { state.awaiting = 'safety'; state.level = Math.max(state.level, 2); return { level: 2, msgs: ["Thank you for telling me. I'm really glad you said it out loud, and I'm taking it seriously.", "You deserve real people in this with you. First I need to know where things stand: are you safe at this moment?"], quick: Q_SAFE }; };
  const afterSafe = () => { state.awaiting = null; return { level: 2, msgs: ["I'm glad you're safe right now. Let's make this moment a little safer together.", "If there is anything near you that you could use to hurt yourself, could you put some distance between you and it? Another room, or with someone else.", "Would you be willing to talk with a trained counsellor on Tele-MANAS, 14416? It's free, 24x7, and they speak your language. I'll stay right here while you call."], quick: [{ l: 'Call Tele-MANAS 14416', act: 'call14416' }, { l: 'Let my trusted circle know', act: 'circle' }, { l: 'Build a safety plan', act: 'plan' }, { l: 'Keep talking', v: '__keep__' }] }; };

  const INTENTS = [
    { id: 'blackmail', rx: /blackmail|sextort|(photo|pic|video|nude|leak|viral).{0,40}(send|post|share|leak|viral|money|pay)|threaten(ing|ed)? (to )?(share|post|leak|send)/i,
      msgs: ["I'm so sorry. This is frightening, and it is not your fault. Threatening to share someone's images is a crime, and there are things that work.", "Please don't pay and don't delete anything: both matter. I can open the emergency guide, which walks through exactly what to do, step by step."],
      quick: [{ l: 'Open the emergency guide', act: 'sos' }, { l: 'Not right now', v: '__keep__' }] },
    { id: 'abuse', rx: /(husband|partner|boyfriend|father|brother|in-?laws?|family|he).{0,40}(hit|beat|abuse|hurt|control|choke|threat)|domestic violence|he hits me|beats me/i,
      msgs: ["I'm really sorry you're living with that. Your safety comes first.", "If you are in danger right now, call 112. The Women Helpline 181 is also available 24x7. Are you safe at this moment?"], quick: Q_SAFE, setAwait: 'safety' },
    { id: 'shame', rx: /ashamed|shame|embarrass|my fault|blame myself|disgust(ed|ing)? with myself|ruined/i,
      msgs: ["What was done to you is not something you did. Shame is exactly what people who hurt others want you to carry. It says nothing true about your worth.", "Many women have been exactly where you are, and many have come through it. What feels heaviest right now?"] },
    { id: 'anxiety', rx: /anxious|anxiety|panic|can'?t breathe|heart (is )?racing|overwhelm|so scared|terrified|afraid/i,
      msgs: ["That sounds really intense, and your body is doing what bodies do when they feel in danger. It will pass. Let's slow it down together.", "Would you like to try a minute of slow breathing, or a grounding exercise using your senses?"], quick: [{ l: 'Breathe with me', act: 'breathe' }, { l: '5-4-3-2-1 grounding', act: 'ground' }] },
    { id: 'lonely', rx: /lonely|all alone|no one (cares|understands|to talk)|nobody (cares|understands)|isolated/i,
      msgs: ["Feeling alone hurts, and I'm glad you reached out instead of sitting with it. I'm here.", "Is there one person you trust, even someone you haven't spoken to in a while? I can help you find the words to message them today."], quick: [{ l: 'Help me write that message', v: '__draftmsg__' }, { l: 'Not yet', v: '__keep__' }] },
    { id: 'sleep', rx: /can'?t sleep|insomnia|nightmare|sleepless/i,
      msgs: ["Nights can be the hardest when the mind won't switch off. Try this: breathe in for 4, out for 6, a few times, and let each thought pass like a cloud without chasing it.", "If sleeplessness keeps going for days, a counsellor on Tele-MANAS (14416) can help with that too."], quick: [{ l: 'Breathe with me', act: 'breathe' }] },
    { id: 'anger', rx: /\b(furious|so angry|rage|hate (him|them|everyone))\b/i,
      msgs: ["Anger makes sense here. Something unfair was done to you. You can be angry and still be safe, and you can let it move through you without acting on it tonight.", "Would it help to write down everything you'd say to them, privately, without sending it? Or shall we plan the next practical step?"] },
    { id: 'thanks', rx: /^(thanks|thank you|thankyou|shukriya|dhanyavaad)\b/i,
      msgs: ["I'm glad you're here. I'm not going anywhere. Remember, the helplines are free and always on whenever you want a human voice."] },
    { id: 'greet', rx: /^(hi+|hello|hey|namaste|hlo|hii+)\b/i,
      msgs: ["Hi, I'm Sahara. I'm here to listen, without judgment. What you say here isn't saved unless you choose to.", "How are you really feeling today?"], quick: [{ l: "I'm anxious", v: "I'm feeling anxious" }, { l: "I'm being harassed online", v: "I'm being harassed online" }, { l: 'I just need to talk', v: '__keep__' }] },
  ];
  const FALLBACK = [
    "I'm listening. Tell me a little more about what has been happening?",
    "Thank you for sharing that. What feels hardest about it right now?",
    "That sounds like a lot to carry. What do you need most at this moment: to vent, to calm down, or to work out a next step?",
  ];

  function reply(raw) {
    state.turn++;
    const tok = /^__(\w+)__$/.exec(raw || '');
    const text = tok ? '' : String(raw || '').trim();

    if (tok) {
      const k = tok[1];
      if (k === 'keep') return { level: 0, msgs: ["Of course. I'm here. What has been weighing on you most?"], quick: [] };
      if (k === 'draftmsg') return { level: 0, msgs: ["Here's something you can send as it is, or change:\n\n“Hey, I've been having a rough time and I don't want to be alone with it. Can you talk, or just stay on a call with me for a bit?”", "Short and honest is enough. People usually want to help and just don't know it's needed."], quick: [] };
      if (state.awaiting === 'ideation') {
        state.awaiting = null;
        if (k === 'yes' || k === 'unsure') return safetyCheck();
        return { level: 1, msgs: ["Thank you for telling me honestly. Being this worn out matters too.", "If that ever changes, even for a moment, tell me and we'll get you support right away. For now, what has been weighing on you most?"], quick: [] };
      }
      if (['safe', 'unsure', 'danger'].includes(k)) {
        state.lastSafety = { safe: 'said she is safe right now', unsure: 'not sure she will stay safe', danger: 'said she is in danger right now' }[k];
        if (k === 'safe') return afterSafe();
        state.level = k === 'danger' ? 3 : 2;
        return { level: state.level, act: 'esc', msgs: ["Thank you for being honest. I'm going to help you reach people right now. You don't have to do any of it alone."], quick: [] };
      }
    }

    const risk = Risk.assess(text);
    if (state.awaiting === 'safety' && !risk.high) {
      if (/danger|not safe|unsafe|about to|going to|have (them|it|the)|can'?t stay safe|i will/i.test(text)) return reply('__danger__');
      if (/\b(safe|ok|okay|fine|alright)\b/i.test(text)) return reply('__safe__');
      return { level: 2, msgs: ["I want to be sure I understand. Are you safe right now?"], quick: Q_SAFE };
    }
    if (risk.level === 3) return imminent();
    if (risk.level === 2) return safetyCheck();
    if (risk.level === 1) { state.awaiting = 'ideation'; state.level = Math.max(state.level, 1); return { level: 1, msgs: ["That sounds exhausting. Carrying this much for this long would wear anyone down.", "I want to ask you something directly, because I care: are you having thoughts of ending your life?"], quick: [{ l: 'Yes', v: '__yes__' }, { l: "No, I'm just exhausted", v: '__no__' }, { l: 'Not sure', v: '__unsure__' }] }; }

    const it = INTENTS.find(i => i.rx.test(text));
    if (it) { if (it.setAwait) state.awaiting = it.setAwait; return { level: 0, intent: it.id, msgs: it.msgs, quick: it.quick || [] }; }
    return { level: 0, msgs: [pick(FALLBACK, state.turn)], quick: [{ l: 'Help me calm down', act: 'breathe' }, { l: 'I need practical steps', act: 'sos' }, { l: 'I just want to talk', v: '__keep__' }] };
  }
  const reset = () => { state.awaiting = null; state.turn = 0; state.level = 0; state.lastSafety = ''; transcript.length = 0; };
  return { reply, state, transcript, reset };
})();

/* ---------------------------------------------------------- safety net */
const Net = {
  def: () => ({ name: '', phone: '', circle: [], consent: { alertCircle: false, share112: false, share: 'summary' }, plan: {} }),
  async load() { try { if (Store.isOpen()) return Object.assign(Net.def(), await Store.get('kv', 'net', Net.def())); } catch {} return Net.def(); },
  async save(n) { await Store.put('kv', 'net', n); },
};
const Geo = {
  get: () => new Promise(res => { if (!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p => res({ lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), accuracy_m: Math.round(p.coords.accuracy) }), () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }); }),
  link: l => l ? `https://maps.google.com/?q=${l.lat},${l.lon}` : '(location unavailable)',
};

/* ---------------------------------------------------------- escalation */
const Escalation = (() => {
  let timers = [], S = null, opts = null, net = null, plan = null;
  const clear = () => { timers.forEach(clearInterval); timers = []; };
  const now = () => new Date().toLocaleTimeString('en-IN');
  const addLog = (t, k = '') => { S.log.push({ t, k, at: now() }); };
  const digits = p => String(p || '').replace(/[^\d+]/g, '');

  async function buildPayload(kind) {
    const loc = await Geo.get(), share = net.consent.share || 'summary';
    const p = { kind, time: new Date().toISOString(), person: { name: net.name || 'Not provided', phone: net.phone || 'Not provided' }, location: loc ? { ...loc, map: Geo.link(loc) } : 'unavailable',
      risk: 'Supportive companion flagged a HIGH risk of self-harm. The person may be in immediate danger.' };
    if (share === 'summary') p.summary = `She expressed thoughts of ending her life during a chat (risk level ${Companion.state.level} of 3). When asked if she was safe, she ${Companion.state.lastSafety || 'did not answer'}.`;
    if (share === 'full') p.transcript = Companion.transcript.slice(-40).map(m => ({ from: m.role, text: m.text, at: m.at }));
    return p;
  }
  const circleText = (p, c) => `Kavach alert for ${c.name}: ${net.name || 'Your loved one'} told a support companion that she may be in danger and may hurt herself. Please call her right now${net.phone ? ' on ' + net.phone : ''}. Last known location: ${typeof p.location === 'object' ? p.location.map : 'not available'}. If you cannot reach her, call 112. She chose to share this with you.`;

  async function relay(kind, payload) {
    try { const r = await fetch(CONFIG.alertEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, payload }) }); return r.ok; } catch { return false; }
  }

  async function doCircle() {
    S.phase = 'circle'; addLog('Preparing the alert for your trusted circle…'); paint();
    const p = await buildPayload('circle');
    if (CONFIG.alertEndpoint) { const ok = await relay('circle', { contacts: net.circle, messages: net.circle.map(c => ({ to: c.phone, text: circleText(p, c) })), ...p }); addLog(ok ? `Alert relayed to ${net.circle.map(c => c.name).join(', ')} via your alert service.` : 'The alert service could not be reached. Use the buttons below to message them now.', ok ? 'ok' : 'sim'); }
    else if (CONFIG.demo) addLog(`SIMULATION: an SMS and WhatsApp message would now be sent to ${net.circle.map(c => c.name).join(', ')}. Nothing was actually sent.`, 'sim');
    else addLog('Tap the buttons below to send the prepared message to each person. Your browser cannot send messages silently.', 'sim');
    S.circlePayload = p; paint();
  }

  async function do112() {
    S.phase = '112'; addLog('Preparing the emergency package for 112…'); paint();
    const p = await buildPayload('112'); S.pkg = p;
    if (CONFIG.alertEndpoint) { const ok = await relay('112', p); addLog(ok ? 'Emergency package sent through your alert service.' : 'Could not reach the alert service. Please call 112 now.', ok ? 'ok' : 'sim'); }
    else if (CONFIG.demo) addLog('SIMULATION: this is the package that would be handed to emergency services. Nothing was actually sent or dialed.', 'sim');
    else { addLog('Opening your phone dialer for 112. The details below are ready to read out or copy.', 'ok'); setTimeout(() => { location.href = 'tel:112'; }, 700); }
    paint();
  }

  async function next() {
    if (S.autoCircle) {
      await doCircle();
      if (S.auto112) { S.phase = 'wait'; S.n = S.ackWait; addLog(`Waiting up to ${S.ackWait}s for someone in your circle to respond…`); startWait(); }
      else S.phase = 'done';
    } else if (S.auto112) { await do112(); S.phase = 'done'; }
    else S.phase = 'done';
    paint();
  }
  function startWait() { clear(); timers.push(setInterval(async () => { S.n--; if (S.n <= 0) { clear(); addLog('No response in time. Escalating.'); await do112(); S.phase = 'done'; } paint(); }, 1000)); }
  function startCount() { clear(); timers.push(setInterval(() => { S.n--; if (S.n <= 0) { clear(); next(); } paint(); }, 1000)); }

  function ack(who = 'Someone in your circle') { if (!S) return toast('Open an escalation first', 'warn'); clear(); S.acked = true; S.phase = 'done'; addLog(`${who} replied and is on the way / calling you. Escalation to 112 cancelled.`, 'ok'); paint(); }
  function close() { clear(); S = null; $('#overlay').innerHTML = ''; document.body.style.overflow = ''; }

  function contactBtns(p) {
    return net.circle.map(c => {
      const msg = encodeURIComponent(circleText(p || { location: 'not available' }, c)), ph = digits(c.phone);
      return `<div class="hl"><div><b style="font-size:1.1rem">${esc(c.name)}</b><span>${esc(c.rel || 'Trusted contact')} · ${esc(c.phone)}</span></div><div class="row">
        <a class="btn sm safe" href="tel:${ph}">${icon('phone')} Call</a><a class="btn sm" href="sms:${ph}?body=${msg}">SMS</a><a class="btn sm" href="https://wa.me/${ph.replace('+', '')}?text=${msg}" target="_blank" rel="noopener">WhatsApp</a></div></div>`;
    }).join('');
  }

  function paint() {
    if (!S) return;
    const names = net.circle.map(c => c.name).join(', ');
    let phase = '';
    if (S.phase === 'count') {
      const what = S.autoCircle ? `Alerting <b>${esc(names)}</b> in ${S.n} second${S.n === 1 ? '' : 's'}${S.auto112 ? '. If no one responds after that, emergency services (112) are contacted' : ''}.` : `Sharing your location and phone number with emergency services (<b>112</b>) in ${S.n} second${S.n === 1 ? '' : 's'}.`;
      phase = `<div class="card center"><div class="big-count" style="color:var(--coral)">${S.n}</div><p style="margin:8px 0 14px">${what}<br><span class="muted small">You set this up because you wanted help to come even if you couldn't ask.</span></p>
        <button class="btn lg block" id="esc-cancel">I'm okay: cancel</button></div>`;
    } else if (S.phase === 'wait') {
      phase = `<div class="card center"><div class="big-count" style="color:var(--coral)">${S.n}</div><p style="margin:8px 0">seconds for someone in your circle to respond before 112 is contacted.</p></div>`;
    } else if (!S.auto) {
      phase = `<div class="card warn"><b>Nothing is sent automatically.</b> You have not turned on automatic alerts, so you decide who to reach. You can set this up any time under <i>Sahara → My safety net</i>.</div>`;
    }
    const pkg = S.pkg ? `<div class="card"><div class="card-title">${icon('pin')} Emergency package for 112</div>${CONFIG.demo && !CONFIG.alertEndpoint ? '<div class="simbanner" style="margin-bottom:10px">SIMULATION: nothing was sent</div>' : ''}<pre class="code">${esc(JSON.stringify(S.pkg, null, 2))}</pre><div class="row" style="margin-top:10px"><button class="btn sm" id="esc-copy">${icon('copy')} Copy details</button><a class="btn sm danger" href="tel:112">${icon('phone')} Call 112</a></div></div>` : '';
    $('#overlay').innerHTML = `<div class="esc"><div class="esc-in">
      <div class="spread"><div class="eyebrow" style="color:#FFD08A">Sahara · support now</div><button class="btn sm ghost" id="esc-close" style="color:#fff;border-color:rgba(255,255,255,.4)">Back to chat</button></div>
      <h1>You are not alone. Let's get people to you.</h1>
      ${CONFIG.demo ? `<div class="simbanner">SIMULATION MODE: no SMS or message is actually sent and nothing is auto-dialed. Buttons that begin a phone call will dial for real.</div>` : ''}
      ${phase}
      <div class="grid g2"><a class="btn danger lg" href="tel:112">${icon('phone')} Call 112 · Emergency</a><a class="btn safe lg" href="tel:14416">${icon('phone')} Tele-MANAS 14416</a></div>
      ${net.circle.length ? `<div class="card"><div class="card-title">${icon('users')} Your trusted circle</div><div class="stack">${contactBtns(S.circlePayload)}</div>
        ${!S.autoCircle || S.phase === 'done' ? `<button class="btn block" id="esc-circle" style="margin-top:12px">${icon('send')} Prepare alert for my circle</button>` : ''}</div>` : `<div class="card"><b>You haven't added trusted people yet.</b><p class="small muted">You can add them in Sahara → My safety net. For now, 112 and Tele-MANAS are one tap away.</p></div>`}
      ${S.log.length ? `<div class="card"><div class="card-title">What is happening</div><div class="log">${S.log.map(l => `<div class="${l.k}"><b>${l.at}</b> · ${esc(l.t)}</div>`).join('')}</div></div>` : ''}
      ${pkg}
      ${S.phase === 'done' ? `<div class="card"><p style="margin:0 0 10px">Whatever you are feeling is real, and so is the help. Stay with someone, or stay on a call, until you feel steadier.</p><button class="btn block" id="esc-safe">I'm safe now</button></div>` : ''}
      </div></div>`;
    document.body.style.overflow = 'hidden';
    const on = (id, fn) => { const e = $('#' + id); if (e) e.onclick = fn; };
    on('esc-cancel', () => { clear(); S.phase = 'done'; S.auto = false; addLog('You cancelled the automatic alert. Nothing was sent.', 'ok'); paint(); });
    on('esc-close', close); on('esc-safe', close);
    on('esc-copy', () => copy(JSON.stringify(S.pkg, null, 2)));
    on('esc-circle', async () => { await doCircle(); S.phase = 'done'; paint(); });
  }

  async function start(o = {}) {
    clear(); opts = o; net = await Net.load();
    const c = net.consent || {}, hasCircle = net.circle.length > 0;
    const forced = o.force === 'circle';
    const autoCircle = forced ? hasCircle : hasCircle && c.alertCircle;
    const auto112 = forced ? false : !!c.share112;
    S = { phase: 'count', n: forced ? 5 : (o.level >= 3 ? 10 : 20), log: [], autoCircle, auto112, auto: autoCircle || auto112, ackWait: CONFIG.demo ? 15 : 120, acked: false };
    if (!S.auto) S.phase = 'idle';
    paint();
    if (S.auto) startCount();
  }
  return { start, ack, close, get running() { return !!S; } };
})();

/* ============================== VIEW ============================== */
if (typeof Router !== 'undefined') (function () {
  const HELP = [['112', 'Emergency', 'Police · Fire · Ambulance', true], ['14416', 'Tele-MANAS', 'Free mental-health counselling, 24x7, many languages', false], ['181', 'Women Helpline', 'Support for women in distress', false], ['14490', 'NCW Women Helpline', 'National Commission for Women, 24x7', false]];
  const telOf = n => 'tel:' + n.replace(/[^\d]/g, '');

  Router.register('sahara', async root => {
    const net = await Net.load(), hasLock = !Store.isOpen();
    root.innerHTML = `<div class="page">
      <div class="page-head"><div class="eyebrow">${icon('heart')} Sahara</div><h1>${t('sahara_title')}</h1><p class="lead">${t('sahara_sub')}</p></div>

  }

    modal(`<div class="spread"><h2>5-4-3-2-1 grounding</h2><button class="btn sm ghost" data-close>${icon('x')}</button></div><p class="muted">This brings your mind back to the present. Say each one out loud or in your head, slowly.</p>

  }

        <div class="card dark"><div class="card-title" style="color:#FFD08A">${icon('lock')} ${t('privacy_h')}</div><p class="small" style="margin:0;color:#E9D8EE">Photos are fingerprinted on your device and never uploaded. Evidence is encrypted here. No account, no tracking. Use <b>Quick exit</b> (or press Esc twice) to leave instantly.</p></div></div></div>
    <div class="card tint" style="margin-top:22px"><div class="spread"><div><div class="card-title" style="margin:0">${t('mood_q')}</div><p class="muted small" style="margin:4px 0 0">If it feels like too much, Sahara is here, and so are people who can help.</p></div>
      <div class="row"><a class="btn" href="#/sahara">Talk to Sahara</a><a class="btn safe" href="tel:14416">${icon('phone')} 14416</a></div></div></div></div>`;
});

Router.register('sos', root => {
  root.innerHTML = `<div class="page"><div class="page-head"><div class="eyebrow" style="color:var(--danger)">${icon('alert')} ${t('nav_sos')}</div><h1>${t('sos_title')}</h1><p class="lead">${t('sos_sub')}</p></div>
    <div class="split"><div class="stack"><div class="steps">${[1, 2, 3, 4, 5].map(i => `<div class="step"><div><h3>${t('sos_' + i)}</h3><p>${t('sos_' + i + 'd')}</p></div></div>`).join('')}</div>
      <div class="card"><div class="card-title">${icon('flask')} Words you can use</div><p class="small muted">If someone is blackmailing you, you can reply once, calmly, then stop:</p>
        <div class="letter" style="max-height:none;font-family:inherit;font-size:.92rem">I will not be paying anything. I have saved all of our conversation and filed a complaint with the cyber crime cell. Any further contact or sharing of my images will be added to the case.</div>
        <button class="btn sm" style="margin-top:10px" id="cpy">${icon('copy')} Copy</button></div></div>
      <div class="stack"><div class="hl red"><div><b>112</b><span>Emergency · immediate danger</span></div><a class="btn danger" href="tel:112">${icon('phone')} ${t('call')}</a></div>
        <div class="hl"><div><b>1930</b><span>Cyber crime helpline</span></div><a class="btn coral" href="tel:1930">${icon('phone')} ${t('call')}</a></div>
        <a class="btn block" href="https://cybercrime.gov.in" target="_blank" rel="noopener">${icon('link')} cybercrime.gov.in: file online</a>
        <a class="btn primary block" href="#/vault?new">${icon('lock')} Save evidence now</a><a class="btn block" href="#/report">${icon('file')} Draft my complaint</a><a class="btn block" href="#/sahara">${icon('heart')} I need someone to talk to</a>
        <div class="card safe"><b>Remember:</b> you are the victim. Offenders rely on shame and silence. Telling one trusted person is often the moment things start to change.</div></div></div></div>`;
  $('#cpy').onclick = () => copy($('.letter', root).textContent);
});

Router.register('help', root => {
  const H = [['112', 'Emergency response', 'Police, fire, ambulance. Unified national number.', 'red'], ['1930', 'National Cyber Crime Helpline', 'Report financial fraud, sextortion, online abuse.', ''], ['14416', 'Tele-MANAS', 'Free tele-mental-health, 24x7, in many languages.', ''], ['14490', 'NCW Women Helpline', 'National Commission for Women, 24x7.', ''], ['181', 'Women Helpline', 'Support and referral for women in distress.', ''], ['1098', 'Childline', 'For children in distress.', '']];
  const R = [['Your images cannot be shared without consent', 'Sharing intimate images without consent is an offence (IT Act ss.66E, 67, 67A; BNS ss.77, 78).'], ['You can ask a platform to remove it', 'Under the IT Rules 2021, platforms must remove intimate-image and impersonation content within 24 hours of a complaint from the person affected.'], ['You can file a complaint online', 'The National Cyber Crime Reporting Portal lets you report without going to a station, and offers an option to report anonymously for some categories.'], ['You do not need to be perfect', 'Panic, deleted messages or late reporting do not make you at fault. Report anyway.'], ['Free legal aid exists', 'Women are entitled to free legal services through the National and State Legal Services Authorities. Ask at your District Legal Services Authority (nalsa.gov.in).'], ['One Stop Centres (Sakhi)', 'Government-run centres give women in distress medical, legal and counselling support under one roof.']];
  root.innerHTML = `<div class="page"><div class="page-head"><div class="eyebrow">${icon('phone')} ${t('nav_help')}</div><h1>Help is closer than it feels.</h1><p class="lead">Last checked 8 Nov 2026 against PIB and NCW pages. Please confirm locally, as services change.</p></div>
    <div class="grid g2" style="margin-bottom:24px">${H.map(([n, nm, d, c]) => `<div class="hl ${c}"><div><b>${n}</b><span><b>${nm}</b><br>${d}</span></div><a class="btn ${c ? 'danger' : 'safe'}" href="tel:${n.replace(/[^\d]/g, '')}">${icon('phone')} ${t('call')}</a></div>`).join('')}</div>
    <h2>Your rights, in plain words</h2><div class="grid g2">${R.map(([h, p]) => `<div class="card"><h3>${h}</h3><p class="muted" style="margin:0">${p}</p></div>`).join('')}</div>
    <div class="card warn" style="margin-top:20px"><b>Not legal advice.</b> Kavach is a self-help tool. Laws and procedures change; a lawyer or legal-aid cell can confirm what applies to you.</div></div>`;
});

Router.register('about', root => {
  root.innerHTML = `<div class="page"><div class="page-head"><div class="eyebrow">${icon('info')} About Kavach</div><h1>Built for the moment nobody else is watching.</h1>
    <p class="lead">Online abuse is a problem with five different systems and no front door. Kavach is that front door.</p></div>
    <div class="grid g3">${[['shield', 'Prevent', 'On-device perceptual fingerprints (pHash) let platforms block re-uploads of a protected photo, even edited. Same principle as StopNCII.'], ['lock', 'Prove', 'Hash-chained, encrypted evidence with a BSA s.63 certificate template and one-click court-ready report.'], ['file', 'Act', 'Complaint drafter, 24-hour takedown notices and a case tracker for the cyber cell route.'], ['heart', 'Heal', 'Sahara, with a consent-based safety net that reaches trusted people and 112.'], ['eye', 'Private', 'No server. No account. AES-256-GCM encryption. Quick exit and disguise mode for unsafe homes.'], ['globe', 'Accessible', 'Installable offline PWA, English and Hindi, runs on a basic phone browser.']].map(([i, h, p]) => `<div class="card"><div class="card-title"><span class="ic">${icon(i)}</span>${h}</div><p class="muted" style="margin:0">${p}</p></div>`).join('')}</div>
    <div class="card" style="margin-top:20px"><div class="card-title">What is real, and what is simulated</div>
      <div class="grid g2"><div><span class="chip safe">Real, runs on-device</span><ul><li>Perceptual hashing and matching</li><li>AES-256-GCM encrypted storage, PBKDF2 key derivation</li><li>SHA-256 hash-chained evidence, verification</li><li>EXIF reading, error-level analysis, metadata cleaning</li><li>Complaint / takedown drafting, case deadlines</li><li>Local crisis-language detection, breathing, grounding</li></ul></div>
      <div><span class="chip warn">Simulated or needs partners</span><ul><li>The “MockGram” platform is a demonstration, not a real platform</li><li>Real cross-platform blocking needs a trusted registry (StopNCII) and platform adoption</li><li>Sending SMS / reaching 112 needs a server relay and an ERSS-112 / telecom partnership. A browser alone cannot do it silently</li><li>ELA is a weak hint, not a deepfake detector</li><li>Sahara is rule-based; it is a companion, not a clinician</li></ul></div></div></div>
    <div class="card" style="margin-top:20px"><div class="card-title">Roadmap</div><div class="pipe"><span class="p on">Now · on-device prototype</span><span class="ar">→</span><span class="p">Pilot with a college ICC + NGO</span><span class="ar">→</span><span class="p">StopNCII hash submission</span><span class="ar">→</span><span class="p">Consent-based alert relay + 112 integration</span><span class="ar">→</span><span class="p">Clinician-reviewed Sahara, more Indian languages</span></div></div>
    <div class="card dark" style="margin-top:20px"><div class="spread"><div><b style="font-family:var(--serif);font-size:1.2rem">Demo controls</b><div class="small muted">For judges: toggle simulation mode for alerts, or wipe local data.</div></div>
      <div class="row"><button class="btn sm" id="dm"></button><button class="btn sm danger" id="wipe">Erase all data</button></div></div></div></div>`;
  const dm = $('#dm'), paint = () => dm.textContent = CONFIG.demo ? 'Simulation mode: ON' : 'Simulation mode: OFF';
  paint(); dm.onclick = () => { CONFIG.demo = !CONFIG.demo; paint(); };
  $('#wipe').onclick = async () => { if (confirm('Erase everything stored on this device?')) { await Store.wipe(); location.reload(); } };
});

Router.onChange = r => App.mark(r);

/* ------------------------------ boot ------------------------------ */
let escAt = 0;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const n = Date.now(); if (n - escAt < 700) App.quickExit(); escAt = n; closeModal(); } });
$('#qexit').addEventListener('click', App.quickExit);

(async function boot() {
  document.documentElement.lang = LANG;
  App.drawChrome();
  await App.gate();
  Router.render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>
</html>
